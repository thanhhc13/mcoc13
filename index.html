<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCOC Champion Strategy & Guide Index</title>
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #161b22;
            --border-color: #30363d;
            --text-main: #94a3b8;
            --text-heading: #f0f6fc;
            
            /* BẢNG MÀU CHUẨN MCOC */
            --cls-all: #f59e0b;       /* All - Vàng Cam */
            --cls-cosmic: #00b4d8;    /* Cosmic - Xanh Dương */
            --cls-mutant: #e9c46a;    /* Mutant - Vàng Vàng */
            --cls-tech: #2a9d8f;      /* Tech - Xanh Ngọc */
            --cls-skill: #e76f51;     /* Skill - Đỏ Cam */
            --cls-science: #52b788;   /* Science - Xanh Lá */
            --cls-mystic: #9d4edd;    /* Mystic - Tím */
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }

        body { 
            background-color: var(--bg-primary); 
            color: var(--text-main); 
            padding: 20px; 
            line-height: 1.6; 
        }

        header { 
            text-align: center; 
            margin-bottom: 25px; 
        }
        header h1 { 
            color: var(--cls-all); 
            font-size: 2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        header p { 
            color: #64748b; 
            font-size: 0.95rem; 
        }

        /* --- THANH MENU NÚT PILL CAPSULE MÀU CHUẨN --- */
        .class-tabs-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 25px auto;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background-color: #0d1117;
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
        }

        .class-tabs {
            display: flex;
            list-style: none;
            width: 100%;
        }

        .tab-box {
            flex: 1;
            min-width: 110px;
            padding: 12px 10px;
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #11161d;
            transition: background-color 0.2s ease;
        }

        .tab-box:first-child {
            border-left: 1px solid var(--border-color);
        }

        .tab-box:hover {
            background-color: #161b22;
        }

        /* Nút Pill bo tròn */
        .tab-pill-btn {
            background: transparent;
            border-radius: 9999px;
            padding: 5px 18px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
            white-space: nowrap;
        }

        /* VIỀN & CHỮ CHO TỪNG CLASS MENU */
        .btn-all { border: 1px solid var(--cls-all); color: var(--cls-all); }
        .btn-all.active, .btn-all:hover { background-color: var(--cls-all); color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

        .btn-cosmic { border: 1px solid var(--cls-cosmic); color: var(--cls-cosmic); }
        .btn-cosmic.active, .btn-cosmic:hover { background-color: var(--cls-cosmic); color: #000; box-shadow: 0 0 10px rgba(0, 180, 216, 0.4); }

        .btn-mutant { border: 1px solid var(--cls-mutant); color: var(--cls-mutant); }
        .btn-mutant.active, .btn-mutant:hover { background-color: var(--cls-mutant); color: #000; box-shadow: 0 0 10px rgba(233, 196, 106, 0.4); }

        .btn-tech { border: 1px solid var(--cls-tech); color: var(--cls-tech); }
        .btn-tech.active, .btn-tech:hover { background-color: var(--cls-tech); color: #000; box-shadow: 0 0 10px rgba(42, 157, 143, 0.4); }

        .btn-skill { border: 1px solid var(--cls-skill); color: var(--cls-skill); }
        .btn-skill.active, .btn-skill:hover { background-color: var(--cls-skill); color: #fff; box-shadow: 0 0 10px rgba(231, 111, 81, 0.4); }

        .btn-science { border: 1px solid var(--cls-science); color: var(--cls-science); }
        .btn-science.active, .btn-science:hover { background-color: var(--cls-science); color: #000; box-shadow: 0 0 10px rgba(82, 183, 136, 0.4); }

        .btn-mystic { border: 1px solid var(--cls-mystic); color: var(--cls-mystic); }
        .btn-mystic.active, .btn-mystic:hover { background-color: var(--cls-mystic); color: #fff; box-shadow: 0 0 10px rgba(157, 78, 221, 0.4); }

        /* Search Input Bar */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 25px auto;
        }

        .search-input {
            width: 300px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            padding: 9px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .search-input:focus { border-color: var(--cls-all); }

        /* Grid hiển thị Tướng */
        .champion-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        /* --- CẤU TRÚC THẺ TƯỚNG BỎ AVATAR (CHỈ HIỆN NHÓM VÀ TÊN) --- */
        .champ-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .champ-card:hover {
            transform: translateY(-4px);
            border-color: var(--cls-all);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* 1. Nhóm Tướng (Badge Class Pill) ở TRÊN */
        .badge-class {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 18px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: transparent;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .cls-cosmic { border: 1.5px solid var(--cls-cosmic); color: var(--cls-cosmic); }
        .cls-tech { border: 1.5px solid var(--cls-tech); color: var(--cls-tech); }
        .cls-mutant { border: 1.5px solid var(--cls-mutant); color: var(--cls-mutant); }
        .cls-skill { border: 1.5px solid var(--cls-skill); color: var(--cls-skill); }
        .cls-science { border: 1.5px solid var(--cls-science); color: var(--cls-science); }
        .cls-mystic { border: 1.5px solid var(--cls-mystic); color: var(--cls-mystic); }

        /* 2. Tên Tướng ở DƯỚI */
        .champ-name { 
            font-size: 1.1rem; 
            font-weight: 800; 
            color: #ffffff; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Modal Chi Tiết Guide */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 16px;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            color: #8b949e;
            cursor: pointer;
        }

        .guide-section { margin-top: 20px; }
        .guide-section h3 { 
            color: var(--cls-all); 
            margin-bottom: 8px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 4px; 
            text-transform: uppercase;
            font-size: 0.95rem;
        }
        .guide-section ul, .guide-section ol { padding-left: 20px; }
        .guide-section li { margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>MCOC Combat Strategy Guide</h1>
        <p>Hướng Dẫn Combo & Cách Đánh Chi Tiết Từng Tướng</p>
    </header>

    <!-- THANH MENU CLASS -->
    <div class="class-tabs-container">
        <div class="class-tabs" id="classTabs">
            <div class="tab-box">
                <button class="tab-pill-btn btn-all active" onclick="app.selectClass('ALL', this)">ALL</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-cosmic" onclick="app.selectClass('Cosmic', this)">COSMIC</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-mutant" onclick="app.selectClass('Mutant', this)">MUTANT</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-tech" onclick="app.selectClass('Tech', this)">TECH</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-skill" onclick="app.selectClass('Skill', this)">SKILL</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-science" onclick="app.selectClass('Science', this)">SCIENCE</button>
            </div>
            <div class="tab-box">
                <button class="tab-pill-btn btn-mystic" onclick="app.selectClass('Mystic', this)">MYSTIC</button>
            </div>
        </div>
    </div>

    <!-- Ô Tìm kiếm -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search champion..." oninput="app.filter()">
    </div>

    <!-- Grid danh sách tướng -->
    <main class="champion-grid" id="gridContainer"></main>

    <!-- Modal Chi Tiết Guide -->
    <div class="modal" id="guideModal" onclick="app.closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="app.closeModal(null, true)">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        class GuideApp {
            constructor() {
                this.championsData = [];
                this.filteredData = [];
                this.selectedClass = 'ALL';
                
                // LINK RAW GITHUB CỦA ANH
                this.jsonUrl = 'https://raw.githubusercontent.com/USERNAME/REPO_NAME/main/champions.json';
                
                this.init();
            }

            async init() {
                const container = document.getElementById('gridContainer');
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--cls-all);">Đang tải dữ liệu từ GitHub...</p>';

                try {
                    const response = await fetch(this.jsonUrl);
                    if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
                    
                    this.championsData = await response.json();
                    this.filteredData = [...this.championsData];
                    this.renderGrid();
                } catch (error) {
                    console.error("Lỗi Fetch Data:", error);
                    // Dữ liệu mẫu dự phòng
                    this.championsData = [
                        {
                            id: "hercules",
                            name: "Hercules",
                            class: "Cosmic",
                            tier: "Beyond God Tier",
                            summary: "Dồn dam cực mạnh nhờ Feat of Strength. Giữ nhịp đánh liên tục để duy trì Bất Tử.",
                            strengths: ["Damage Burst cực lớn", "Bất tử khi KO (Unkillable)", "Chống True Damage"],
                            weaknesses: ["Sợ Nullify/Stagger", "Cần Kỹ năng Intercept tốt"],
                            rotation: [
                                "Mở đầu trận: Intercept (ngắt đòn) để lấy Feats đầu tiên.",
                                "Tích 12 Feats -> Tung SP1 lấy Buff Precision.",
                                "Gợi ý Combo: 5 Hit -> SP1 -> Heavy -> SP2 dứt điểm."
                            ],
                            counters: ["Absorbing Man", "Doctor Doom", "Rintrah"]
                        },
                        {
                            id: "ghost",
                            name: "Ghost",
                            class: "Tech",
                            tier: "God Tier",
                            summary: "Lối đánh Phase (xuyên thấu) độc nhất. Bỏ qua mọi đòn đánh của địch để trả Critical Hits.",
                            strengths: ["Chống sát thương gián tiếp", "Chí mạng 100% khi ra đòn từ Phase"],
                            weaknesses: ["Khó chơi, cần luyện tập nhịp Phase", "Sợ Armor Break"],
                            rotation: [
                                "Vuốt lùi để kích hoạt Phase.",
                                "Để đối thủ đánh hụt (Miss) 1 nhịp -> Phản công bằng M-L-L-L-M.",
                                "Tích thanh SP2 -> Phase -> Tung SP2 dứt điểm."
                            ],
                            counters: ["Red Magneto", "CGR", "Armor Break Champs"]
                        }
                    ];
                    this.filteredData = [...this.championsData];
                    this.renderGrid();
                }
            }

            renderGrid() {
                const container = document.getElementById('gridContainer');
                if (this.filteredData.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e;">Không tìm thấy tướng phù hợp.</p>';
                    return;
                }

                container.innerHTML = this.filteredData.map(champ => {
                    const classSlug = champ.class.toLowerCase();
                    const classNameText = champ.class.toUpperCase();

                    return `
                        <div class="champ-card" onclick="app.openGuide('${champ.id}')">
                            <span class="badge-class cls-${classSlug}">${classNameText}</span>
                            <div class="champ-name">${champ.name}</div>
                        </div>
                    `;
                }).join('');
            }

            selectClass(clsName, element) {
                this.selectedClass = clsName;
                
                document.querySelectorAll('.tab-pill-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');

                this.filter();
            }

            filter() {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();

                this.filteredData = this.championsData.filter(c => {
                    const matchName = c.name.toLowerCase().includes(query);
                    const matchClass = this.selectedClass === 'ALL' || c.class.toLowerCase() === this.selectedClass.toLowerCase();
                    return matchName && matchClass;
                });

                this.renderGrid();
            }

            openGuide(champId) {
                const champ = this.championsData.find(c => c.id === champId);
                if (!champ) return;

                const modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px;">
                        <div>
                            <h2 style="color: var(--text-heading); font-size: 1.6rem;">${champ.name}</h2>
                            <span class="badge-class cls-${champ.class.toLowerCase()}" style="margin-bottom:0; margin-top:6px;">${champ.class.toUpperCase()}</span>
                        </div>
                        ${champ.tier ? `<span style="font-size:0.9rem; color:var(--cls-all); font-weight:bold;">${champ.tier}</span>` : ''}
                    </div>

                    <p><em>${champ.summary || ''}</em></p>

                    <div class="guide-section">
                        <h3>1. Ưu & Nhược Điểm</h3>
                        <p><strong style="color:#52b788;">Điểm mạnh:</strong> ${(champ.strengths || []).join(', ')}</p>
                        <p><strong style="color:#e76f51;">Nhược điểm:</strong> ${(champ.weaknesses || []).join(', ')}</p>
                    </div>

                    <div class="guide-section">
                        <h3>2. Vòng Lặp Combo & Cách Đánh (Rotation)</h3>
                        <ol>
                            ${(champ.rotation || []).map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    </div>

                    <div class="guide-section">
                        <h3>3. Tướng Khắc Chế (Counters)</h3>
                        <ul>
                            ${(champ.counters || []).map(ctr => `<li>${ctr}</li>`).join('')}
                        </ul>
                    </div>
                `;

                document.getElementById('guideModal').style.display = 'flex';
            }

            closeModal(event, force = false) {
                if (force || (event && event.target.id === 'guideModal')) {
                    document.getElementById('guideModal').style.display = 'none';
                }
            }
        }

        const app = new GuideApp();
    </script>
</body>
</html>
