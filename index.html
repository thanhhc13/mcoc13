<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCOC Champion Strategy & Guide Index</title>
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #161b22;
            --border-color: #21262d;
            --text-main: #94a3b8;
            --text-heading: #f0f6fc;
            
            /* BẢNG MÀU CHUẨN MCOC */
            --cls-all: #f59e0b;       /* All - Vàng Cam */
            --cls-cosmic: #00b4d8;    /* Cosmic - Xanh Dương */
            --cls-mutant: #e9c46a;    /* Mutant - Vàng Vàng */
            --cls-tech: #2a9d8f;      /* Tech - Xanh Ngọc */
            --cls-skill: #e76f51;     /* Skill - Đỏ Cam */
            --cls-science: #52b788;   /* Science - Xanh Lá */
            --cls-mystic: #9d4edd;    /* Mystic - Tím */
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }

        body { 
            background-color: var(--bg-primary); 
            color: var(--text-main); 
            padding: 12px; 
            line-height: 1.4; 
        }

        header { 
            text-align: center; 
            margin-bottom: 16px; 
        }
        header h1 { 
            color: var(--cls-all); 
            font-size: 1.4rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        header p { 
            color: #64748b; 
            font-size: 0.8rem; 
        }

        /* --- THANH MENU FILTER LƯỚT NGANG --- */
        .class-tabs-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            padding-bottom: 6px;
            -webkit-overflow-scrolling: touch;
        }

        .class-tabs {
            display: flex;
            gap: 8px;
            list-style: none;
        }

        .tab-pill-btn {
            background: rgba(22, 27, 34, 0.6);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        /* MÀU ĐẶC TRƯNG TAB MENU */
        .btn-all { border: 1px solid var(--cls-all); color: var(--cls-all); }
        .btn-all.active { background-color: var(--cls-all); color: #000; }

        .btn-cosmic { border: 1px solid var(--cls-cosmic); color: var(--cls-cosmic); }
        .btn-cosmic.active { background-color: var(--cls-cosmic); color: #000; }

        .btn-mutant { border: 1px solid var(--cls-mutant); color: var(--cls-mutant); }
        .btn-mutant.active { background-color: var(--cls-mutant); color: #000; }

        .btn-tech { border: 1px solid var(--cls-tech); color: var(--cls-tech); }
        .btn-tech.active { background-color: var(--cls-tech); color: #000; }

        .btn-skill { border: 1px solid var(--cls-skill); color: var(--cls-skill); }
        .btn-skill.active { background-color: var(--cls-skill); color: #fff; }

        .btn-science { border: 1px solid var(--cls-science); color: var(--cls-science); }
        .btn-science.active { background-color: var(--cls-science); color: #000; }

        .btn-mystic { border: 1px solid var(--cls-mystic); color: var(--cls-mystic); }
        .btn-mystic.active { background-color: var(--cls-mystic); color: #fff; }

        /* Ô TÌM KIẾM GỌN NHẸ */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 16px auto;
        }

        .search-input {
            width: 100%;
            max-width: 320px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
            display: block;
            margin: 0 auto;
        }

        .search-input:focus { border-color: var(--cls-all); }

        /* --- GRID HIỂN THỊ MẶC ĐỊNH MOBILE: 3 CỘT KHÓA KÍCH THƯỚC --- */
        .champion-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        @media (min-width: 768px) {
            .champion-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
        }

        /* --- THẺ TƯỚNG CỐ ĐỊNH CHIỀU CAO (KHÔNG BỊ PHÌNH KHI CHỮ DÀI) --- */
        .champ-card {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 6px 4px;
            height: 72px; /* Kích thước cố định chuẩn mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s ease;
        }

        .champ-card:active {
            transform: scale(0.96);
        }

        .badge-class {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: transparent;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .cls-cosmic { border: 1px solid var(--cls-cosmic); color: var(--cls-cosmic); }
        .cls-tech { border: 1px solid var(--cls-tech); color: var(--cls-tech); }
        .cls-mutant { border: 1px solid var(--cls-mutant); color: var(--cls-mutant); }
        .cls-skill { border: 1px solid var(--cls-skill); color: var(--cls-skill); }
        .cls-science { border: 1px solid var(--cls-science); color: var(--cls-science); }
        .cls-mystic { border: 1px solid var(--cls-mystic); color: var(--cls-mystic); }

        /* TÊN TƯỚNG TỰ ĐỘNG CẮT 2 DÒNG NẾU QÚA DÀI */
        .champ-name { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #ffffff; 
            width: 100%;
            padding: 0 2px;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        /* MODAL POPUP HƯỚNG DẪN */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 12px;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 12px;
            overflow-y: auto;
            padding: 18px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 16px;
            font-size: 1.6rem;
            color: #8b949e;
            cursor: pointer;
        }

        .guide-section { margin-top: 16px; }
        .guide-section h3 { 
            color: var(--cls-all); 
            margin-bottom: 6px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 4px; 
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .guide-section ul, .guide-section ol { padding-left: 18px; font-size: 0.85rem; }
        .guide-section li { margin-bottom: 6px; line-height: 1.35; }
    </style>
</head>
<body>

    <header>
        <h1>MCOC Combat Guide</h1>
        <p>Hướng Dẫn Cách Đánh Từng Champ</p>
    </header>

    <!-- MENU THỜI TRANG LƯỚT NGANG LÊN MÀU -->
    <div class="class-tabs-container">
        <div class="class-tabs">
            <button class="tab-pill-btn btn-all active" onclick="app.selectClass('all', this)">ALL</button>
            <button class="tab-pill-btn btn-cosmic" onclick="app.selectClass('cosmic', this)">COSMIC</button>
            <button class="tab-pill-btn btn-mutant" onclick="app.selectClass('mutant', this)">MUTANT</button>
            <button class="tab-pill-btn btn-tech" onclick="app.selectClass('tech', this)">TECH</button>
            <button class="tab-pill-btn btn-skill" onclick="app.selectClass('skill', this)">SKILL</button>
            <button class="tab-pill-btn btn-science" onclick="app.selectClass('science', this)">SCIENCE</button>
            <button class="tab-pill-btn btn-mystic" onclick="app.selectClass('mystic', this)">MYSTIC</button>
        </div>
    </div>

    <!-- TÌM KIẾM TƯỚNG -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Tìm tên tướng..." oninput="app.filter()">
    </div>

    <!-- GRID DANH SÁCH TƯỚNG 3 CỘT CHO DẾ -->
    <main class="champion-grid" id="gridContainer"></main>

    <!-- POPUP MODAL XEM HƯỚNG DẪN -->
    <div class="modal" id="guideModal" onclick="app.closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="app.closeModal(null, true)">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        class GuideApp {
            constructor() {
                this.championsData = [];
                this.filteredData = [];
                this.selectedClass = 'all';
                
                // ĐƯỜNG DẪN RAW GITHUB JSON CHÍNH THỨC
                this.jsonUrl = 'https://raw.githubusercontent.com/thanhhc13/mcoc13/refs/heads/main/champions.json';
                this.init();
            }

            async init() {
                const container = document.getElementById('gridContainer');
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--cls-all); font-size: 0.85rem;">Đang tải dữ liệu từ GitHub...</p>';

                try {
                    const response = await fetch(this.jsonUrl);
                    if (!response.ok) throw new Error(`HTTP Status: ${response.status}`);
                    this.championsData = await response.json();
                    this.filteredData = [...this.championsData];
                    this.renderGrid();
                } catch (error) {
                    console.error("Lỗi đọc JSON từ GitHub:", error);
                    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ef4444; font-size: 0.85rem;">
                        Không thể tải dữ liệu từ GitHub Repo.<br><small>${error.message}</small>
                    </p>`;
                }
            }

            renderGrid() {
                const container = document.getElementById('gridContainer');
                if (this.filteredData.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e; font-size: 0.8rem;">Không tìm thấy tướng nào.</p>';
                    return;
                }

                container.innerHTML = this.filteredData.map(champ => {
                    const rawClass = champ.class ? champ.class.toString().toLowerCase() : 'all';
                    const classNameText = rawClass.toUpperCase();

                    return `
                        <div class="champ-card" onclick="app.openGuide('${champ.id}')">
                            <span class="badge-class cls-${rawClass}">${classNameText}</span>
                            <div class="champ-name" title="${champ.name}">${champ.name}</div>
                        </div>
                    `;
                }).join('');
            }

            selectClass(clsName, element) {
                this.selectedClass = clsName.toLowerCase();
                document.querySelectorAll('.tab-pill-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
                this.filter();
            }

            filter() {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();

                this.filteredData = this.championsData.filter(c => {
                    const matchName = c.name ? c.name.toLowerCase().includes(query) : false;
                    const cClass = c.class ? c.class.toString().toLowerCase() : '';
                    const matchClass = (this.selectedClass === 'all') || (cClass === this.selectedClass);
                    return matchName && matchClass;
                });

                this.renderGrid();
            }

            openGuide(champId) {
                const champ = this.championsData.find(c => c.id === champId);
                if (!champ) return;

                const rawClass = champ.class ? champ.class.toString().toLowerCase() : 'all';

                // Đọc đúng cấu trúc khắc chế chuẩn (Hỗ trợ cả chuẩn mới lẫn chuẩn cũ nếu có)
                const targetsList = champ.counters_targets || champ.counters || [];
                const counteredByList = champ.countered_by || [];

                const modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                        <div>
                            <h2 style="color: var(--text-heading); font-size: 1.3rem;">${champ.name}</h2>
                            <span class="badge-class cls-${rawClass}" style="margin-bottom:0; margin-top:4px;">${rawClass.toUpperCase()}</span>
                        </div>
                        ${champ.tier ? `<span style="font-size:0.75rem; color:var(--cls-all); font-weight:bold; border:1px solid var(--cls-all); padding:2px 6px; border-radius:4px;">${champ.tier}</span>` : ''}
                    </div>

                    <p style="font-size: 0.85rem; margin-bottom: 14px; color: #cbd5e1;"><em>${champ.summary || ''}</em></p>

                    <div class="guide-section">
                        <h3>1. Ưu & Nhược Điểm</h3>
                        <div style="font-size:0.8rem; margin-bottom: 6px;">
                            <strong style="color:#52b788;">Ưu điểm:</strong>
                            <ul style="margin-top:4px;">
                                ${(champ.strengths || []).map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div style="font-size:0.8rem; margin-top: 8px;">
                            <strong style="color:#e76f51;">Nhược điểm:</strong>
                            <ul style="margin-top:4px;">
                                ${(champ.weaknesses || []).map(w => `<li>${w}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="guide-section">
                        <h3>2. Vòng Lặp Combo & Cách Đánh (Rotation)</h3>
                        <ol>
                            ${(champ.rotation || []).map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    </div>

                    <div class="guide-section">
                        <h3>3. Tướng & Cơ Chế Khắc Chế (Counters)</h3>
                        <div style="font-size:0.8rem; margin-bottom: 6px;">
                            <strong style="color:#00b4d8;">Con bài khắc chế (Đánh tốt khi gặp):</strong>
                            <ul style="margin-top:4px;">
                                ${targetsList.map(t => `<li>${t}</li>`).join('')}
                            </ul>
                        </div>
                        ${counteredByList.length > 0 ? `
                        <div style="font-size:0.8rem; margin-top: 8px;">
                            <strong style="color:#e9c46a;">Bị khắc chế bởi (Cẩn thận khi gặp):</strong>
                            <ul style="margin-top:4px;">
                                ${counteredByList.map(cb => `<li>${cb}</li>`).join('')}
                            </ul>
                        </div>` : ''}
                    </div>
                `;

                document.getElementById('guideModal').style.display = 'flex';
            }

            closeModal(event, force = false) {
                if (force || (event && event.target.id === 'guideModal')) {
                    document.getElementById('guideModal').style.display = 'none';
                }
            }
        }

        const app = new GuideApp();
    </script>
</body>
</html>
